server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: acxiom-crm-backend
  datasource:
    url: jdbc:h2:file:./crm_data/acxiomcrm;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  security:
    max-failed-attempts: 5
    lockout-duration-minutes: 15
